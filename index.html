<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOFRA | Interactive Food Menu</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS Link -->
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <i class="fa-solid fa-utensils"></i> SOFRA
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="cart-btn" id="cartBtn" title="Open Cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Delicious Food, Crafted with Love</h1>
        <p>Explore our exquisite menu and order your favorite dishes online.</p>
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search for dishes (e.g., Burger, Pasta)...">
        </div>
    </section>

    <!-- Main Container -->
    <div class="container">
        <!-- Category Filters -->
        <div class="filters">
            <button class="filter-btn active" data-category="all">All Dishes</button>
            <button class="filter-btn" data-category="breakfast">Breakfast</button>
            <button class="filter-btn" data-category="lunch">Lunch</button>
            <button class="filter-btn" data-category="dinner">Dinner</button>
            <button class="filter-btn" data-category="desserts">Desserts</button>
            <button class="filter-btn" data-category="drinks">Drinks</button>
        </div>

        <!-- Menu Items Grid -->
        <div class="menu-grid" id="menuGrid">
            <!-- Items will be dynamically generated by JavaScript -->
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div class="overlay" id="overlay"></div>
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h3>Your Order Cart</h3>
            <button class="close-cart" id="closeCart"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items" id="cartItems">
            <p style="text-align: center; color: #888; margin-top: 2rem;">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 SOFRA. Crafted with passion for portfolio excellence.</p>
    </footer>

    <!-- Custom JavaScript Link -->
    <script src="JS/script.js"></script>
</body>
</html>
